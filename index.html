<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Orçamentos & Contratos — Churrasco em Brasília Buffet</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Orçamentos">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --verde:#047232;--vermelho:#ac1f18;--amarelo:#c2b904;--ouro:#c9b35f;
  --bg:#111;--card:#1b1b1b;--card2:#232323;--linha:#333;--txt:#eee;--mudo:#9a9a9a;
  --ok:#2e9e5b;--erro:#d64545;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Red Hat Display',system-ui,sans-serif;font-size:15px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;background:var(--card2);color:var(--txt)}
button.p{background:var(--verde);color:#fff}
button.o{background:var(--ouro);color:#111}
button.v{background:var(--vermelho);color:#fff}
button.g{background:transparent;border:1px solid var(--linha);color:var(--mudo)}
button.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
button.x{background:transparent;color:var(--mudo);padding:4px 8px;font-size:18px;line-height:1}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--txt);background:#0c0c0c;border:1px solid var(--linha);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:64px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ouro)}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;min-height:44px;line-height:1.3}
input::-webkit-date-and-time-value{text-align:left;min-height:1.3em}
input::-webkit-calendar-picker-indicator{filter:invert(.8)}
label{display:block;font-size:12.5px;color:var(--mudo);margin:10px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.topo{position:sticky;top:0;z-index:5;background:#000;border-bottom:2px solid var(--ouro);padding:10px 14px;display:flex;align-items:center;gap:10px}
.topo .marca{font-weight:700;color:var(--ouro);font-size:16px;flex:1;line-height:1.1}
.topo .marca small{display:block;color:var(--mudo);font-weight:500;font-size:11.5px}
.topo .user{font-size:12.5px;color:var(--mudo)}
.wrap{max-width:820px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:15px;color:var(--ouro)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.row>*{flex:1 1 140px;min-width:0}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hidden{display:none!important}
.mudo{color:var(--mudo);font-size:13px}
.aviso{background:#2a2410;border:1px solid var(--ouro);color:#f1e6b8;padding:10px 12px;border-radius:10px;font-size:13.5px;margin:8px 0}
/* login */
.login{max-width:380px;margin:60px auto;text-align:center}
.login img{width:100%;border-radius:12px;margin-bottom:16px}
/* lista */
.filtros{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.filtros button{white-space:nowrap}
.filtros button.ativo{background:var(--ouro);color:#111}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--linha);border-radius:14px;margin-bottom:8px;cursor:pointer}
.item:active{background:var(--card2)}
.item .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:#000;flex-shrink:0}
.item .info{flex:1;min-width:0}
.item .nome{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12.5px;color:var(--mudo);margin-top:2px}
.item .val{text-align:right;font-weight:700;color:var(--ouro);white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.3px}
.b-rascunho{background:#333;color:#ccc}.b-enviado{background:#2b3a6b;color:#cfe0ff}.b-aprovado{background:#1e5a3a;color:#c9f5dc}
.b-contrato_enviado{background:#4a3d12;color:#ffe9a8}.b-confirmado{background:#0f6b3f;color:#d4ffe6}
.b-realizado{background:#0b4a2b;color:#9ee3bd}.b-cancelado{background:#5a1c1c;color:#ffc8c8}
/* editor */
.abas{display:flex;gap:4px;background:#000;padding:4px;border-radius:12px;margin-bottom:12px;position:sticky;top:58px;z-index:4}
.abas button{flex:1;background:transparent;color:var(--mudo)}
.abas button.ativo{background:var(--card2);color:var(--ouro)}
details.sec{background:var(--card);border:1px solid var(--linha);border-radius:14px;margin-bottom:10px;overflow:hidden}
details.sec>summary{cursor:pointer;list-style:none;padding:13px 14px;font-weight:700;color:var(--ouro);display:flex;align-items:center;gap:8px;user-select:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:'+';margin-left:auto;color:var(--mudo);font-size:18px}
details.sec[open]>summary::after{content:'–'}
details.sec>summary .dica{font-weight:500;color:var(--mudo);font-size:12px}
details.sec>.corpo{padding:0 14px 14px}
.opcoes{display:flex;flex-direction:column;gap:6px}
.opc{display:flex;gap:10px;align-items:flex-start;background:#0c0c0c;border:1px solid var(--linha);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14px}
.opc input{width:auto;margin-top:2px;accent-color:var(--ouro)}
label.opc,label.chk{text-transform:none;letter-spacing:0;color:var(--txt);font-weight:400;font-size:14px}
.opc.on{border-color:var(--ouro)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:8px 0;cursor:pointer}
.chk input{width:auto;accent-color:var(--ouro)}
.lin{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.lin input,.lin textarea{flex:1}
.lin .cor{width:34px;height:34px;border-radius:8px;border:2px solid var(--linha);flex-shrink:0;padding:0}
.lin .cor.dourado{background:var(--ouro)}.lin .cor.branco{background:#fff}
.pac{background:#0c0c0c;border:1px solid var(--linha);border-radius:12px;padding:10px;margin-bottom:8px}
.pac .tit{font-weight:700;font-size:13px;color:var(--ouro);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.secao{background:#0c0c0c;border:1px solid var(--linha);border-radius:12px;padding:10px;margin-bottom:8px}
.secao .cab{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.secao .cab input{font-weight:700;color:var(--ouro)}
.secao .itens .lin input{padding:7px 10px;font-size:14px}
.pagtit{font-size:12px;color:var(--mudo);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px;font-weight:700}
.total{font-size:22px;font-weight:700;color:var(--ouro)}
.rodape-fixo{position:sticky;bottom:0;background:linear-gradient(transparent,#111 30%);padding:14px 0 6px;display:flex;gap:8px}
.rodape-fixo button{flex:1;padding:13px}
/* status */
.fluxo{display:flex;flex-direction:column;gap:0;margin:8px 0}
.passo{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--linha)}
.passo .bola{width:26px;height:26px;border-radius:50%;border:2px solid var(--linha);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.passo.feito .bola{background:var(--verde);border-color:var(--verde);color:#fff}
.passo.atual .bola{border-color:var(--ouro);color:var(--ouro)}
.passo .nome{flex:1;font-weight:600}
.passo.atual .nome{color:var(--ouro)}
.hist{font-size:13px;color:var(--mudo);padding:6px 0;border-bottom:1px solid var(--linha)}
.hist b{color:var(--txt)}
/* preview */
.prev{position:fixed;inset:0;background:#000;z-index:50;overflow:auto;display:flex;flex-direction:column}
.prev .barra{position:sticky;top:0;background:#000;border-bottom:2px solid var(--ouro);padding:10px 14px;display:flex;gap:8px;align-items:center;z-index:2}
.prev .barra .t{flex:1;font-weight:700;color:var(--ouro)}
.prev .pags{padding:14px;display:flex;flex-direction:column;align-items:center;gap:14px}
.prev .esc{transform-origin:top left}
.pgwrap{position:relative;overflow:hidden;box-shadow:0 4px 30px rgba(0,0,0,.6)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ouro);color:#111;font-weight:700;padding:10px 16px;border-radius:99px;z-index:99;box-shadow:0 4px 20px rgba(0,0,0,.5)}
/* ===== DOCUMENTOS (A4 = 794 x 1123 px) ===== */
.pg{width:794px;height:1123px;position:relative;overflow:hidden;font-family:'Red Hat Display',sans-serif;color:#fff;background:#000}
.pg .miolo{position:absolute;left:0;top:0;width:794px;transform-origin:top left}
.pg.orc .cab{display:flex;align-items:flex-start;height:200px}
.pg.orc .cab img{width:384px;height:198px;object-fit:cover;display:block}
.pg.orc .cab .tit{flex:1;text-align:center;padding-top:64px;font-size:15.5px;line-height:1.45}
.pg.orc .cab .tit .a{margin-bottom:26px}
.pg.orc .corpo{padding:26px 16px 0 16px;font-size:14.6px;line-height:1.5}
.pg.orc p{margin:0 0 18px}
.pg.orc .d{color:var(--ouro)}
.pg.orc .c{text-align:center}
.pg.orc ul{margin:0 0 18px;padding-left:26px}
.pg.orc li{margin:0 0 2px}
.pg.orc .nota{font-style:italic;font-size:13.5px;color:var(--ouro);margin:-14px 0 18px 26px}
.pg.orc .tot{color:var(--ouro);font-weight:700;font-size:20px;margin:14px 0 22px}
.pg.orc .ass{text-align:center;line-height:1.5;margin-top:10px}
.pg.orc .grade{display:flex;flex-wrap:wrap;padding:0 30px}
.pg.orc .sec{width:50%;padding:0 10px 22px}
.pg.orc .sec.inteira{width:100%}
.pg.orc .sec h4{color:var(--ouro);font-weight:400;font-size:16.5px;text-align:center;margin:0 0 20px}
.pg.orc .sec.semitens h4{margin-bottom:4px}
.pg.orc .sec ul{margin:0;padding-left:40px;font-size:14px;line-height:1.55}
.pg.orc .sec.duascol ul{columns:2;column-gap:20px}
.pg.orc .sec.duascol li{break-inside:avoid}
.pg.orc .fim{position:absolute;left:0;bottom:0;width:794px;height:190px;display:flex;align-items:flex-end}
.pg.orc .fim .txt{flex:1;padding:0 0 30px 40px;text-align:center;font-size:16.5px;line-height:1.55}
.pg.orc .fim .txt a{color:var(--ouro);text-decoration:underline}
.pg.orc .fim img{width:290px;height:190px;object-fit:cover;display:block;margin-left:auto}
.pg.mao .corpo{font-size:15px}
.pg.mao .corpo h3{color:var(--ouro);font-weight:700;font-size:20px;margin:0 0 6px}
.pg.mao .corpo .sub{color:var(--ouro);font-style:italic;margin-bottom:22px}
/* contrato */
.pg.ctr{background:#fff;color:#000;font-family:'Tinos','Times New Roman',Times,serif;font-size:14.9px;line-height:1.3}
.pg.ctr .miolo{padding:58px 66px}
.pg.ctr h2{text-align:center;font-size:16.5px;margin:0 0 16px;font-weight:700}
.pg.ctr p{margin:0 0 12px;text-align:justify}
.pg.ctr .ind{margin-left:52px}
.pg.ctr .ind u{text-decoration:underline}
.pg.ctr .banco{display:flex;margin:0 0 12px}
.pg.ctr .banco .l{width:270px;margin-left:52px}
.pg.ctr .banco .r{text-align:center;flex:1;line-height:1.55}
.pg.ctr .data{text-align:center;margin:24px 0 46px}
.pg.ctr .assin{text-align:center;margin-top:40px;line-height:1.5}
.pg.ctr .assin b{display:block}
</style>
</head>
<body>

<div class="topo">
  <div class="marca">Churrasco em Brasília Buffet<small>Orçamentos & Contratos</small></div>
  <div class="user" id="topoUser"></div>
  <button class="g sm hidden" id="btnSair">Sair</button>
</div>

<!-- LOGIN -->
<div id="vLogin" class="wrap login hidden">
  <img id="loginImg" alt="Churrasco em Brasília Buffet">
  <div class="card" style="text-align:left">
    <div id="loginSupa">
      <label>E-mail</label><input id="lEmail" type="email" autocomplete="username">
      <label>Senha</label><input id="lSenha" type="password" autocomplete="current-password">
      <div class="acoes"><button class="o" style="flex:1" id="btnEntrar">Entrar</button></div>
      <div class="mudo" id="lErro" style="margin-top:8px"></div>
    </div>
    <div id="loginLocal" class="hidden">
      <div class="aviso">Modo de teste (sem Supabase): os orçamentos ficam salvos só neste aparelho.</div>
      <label>Quem está usando?</label>
      <select id="lNome"><option value="Saymon">Saymon</option><option value="Mayron">Mayron</option><option value="Nayara">Nayara</option></select>
      <div class="acoes"><button class="o" style="flex:1" id="btnEntrarLocal">Entrar</button></div>
    </div>
  </div>
</div>

<!-- LISTA -->
<div id="vLista" class="wrap hidden">
  <div class="acoes" style="margin:0 0 12px">
    <button class="o" style="flex:1;padding:13px" id="btnNovoBuffet">+ Orçamento Buffet</button>
    <button class="p" style="flex:1;padding:13px" id="btnNovoMao">+ Orçamento Mão de Obra</button>
    <button style="flex:1 1 100%;padding:13px;border:1px solid var(--ouro);background:#000;color:var(--ouro)" id="btnNovoCtr">📄 + Só o Contrato</button>
  </div>
  <input id="busca" placeholder="Buscar por cliente, local ou telefone…" style="margin-bottom:8px">
  <div class="filtros" id="filtros"></div>
  <div id="lista"></div>
</div>

<!-- EDITOR -->
<div id="vEditor" class="wrap hidden">
  <div class="acoes" style="margin:0 0 10px;align-items:center">
    <button class="g sm" id="btnVoltar">← Lista</button>
    <div style="flex:1;font-weight:700" id="edTitulo"></div>
    <span id="edBadge"></span><span class="mudo" id="autosave" style="font-size:12px"></span>
  </div>
  <div class="abas">
    <button class="ativo" data-aba="orc">Orçamento</button>
    <button data-aba="ctr">Contrato</button>
    <button data-aba="st">Status</button>
  </div>
  <div id="abaOrc"></div>
  <div id="abaCtr" class="hidden"></div>
  <div id="abaSt" class="hidden"></div>
  <div class="rodape-fixo">
    <button class="g" id="btnSalvar">Salvar</button>
    <button class="o" id="btnVer">Visualizar</button>
    <button class="p" id="btnPdf">PDF / Enviar</button>
  </div>
</div>

<!-- PREVIEW -->
<div id="vPrev" class="prev hidden">
  <div class="barra">
    <button class="g sm" id="btnFecharPrev">✕ Fechar</button>
    <div class="t" id="prevTit"></div>
    <button class="p sm" id="btnPrevPdf">PDF / Enviar</button>
  </div>
  <div class="pags" id="prevPags"></div>
</div>

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function hoje(){ const d=new Date(); return d.toISOString().slice(0,10); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function moeda(v){ v=Number(v)||0; return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function moedaCtr(v){ v=Number(v)||0; return 'R$'+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function num(v){ if(typeof v==='number') return v; v=String(v||'').replace(/[R$\s.]/g,'').replace(',','.'); return parseFloat(v)||0; }
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function dataExt(iso){ if(!iso) return '___ de ________ de ____'; const [a,m,d]=iso.split('-'); return `${parseInt(d)} de ${MESES[parseInt(m)-1]} de ${a}`; }
function dataBR(iso){ if(!iso) return ''; const [a,m,d]=iso.split('-'); return `${d}/${m}/${a}`; }
function horaCtr(h){ if(!h) return '__h__min'; const [hh,mm]=h.split(':'); return `${hh}h${mm}min`; }
function semAcento(t){ return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w\s.-]/g,'').trim(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* números por extenso (pt-BR) */
const U=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
const D=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
const C=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
function ext999(n){
  if(n===0) return ''; if(n===100) return 'cem';
  const c=Math.floor(n/100), r=n%100, d=Math.floor(r/10), u=r%10; const p=[];
  if(c) p.push(C[c]);
  if(r<20){ if(r) p.push(U[r]); } else { p.push(D[d]); if(u) p.push(U[u]); }
  return p.join(' e ');
}
function extInt(n){
  n=Math.floor(Math.abs(n)); if(n===0) return 'zero';
  const esc_=[['',''],['mil','mil'],['milhão','milhões'],['bilhão','bilhões']];
  const partes=[]; let i=0;
  while(n>0){ const g=n%1000; if(g){ let s=ext999(g); if(i===1) s=(g===1?'':s+' ')+'mil'; else if(i>1) s+=' '+(g===1?esc_[i][0]:esc_[i][1]); partes.unshift({s,g,i}); } n=Math.floor(n/1000); i++; }
  let out=''; for(let k=0;k<partes.length;k++){ const p=partes[k]; if(k>0){ const ult=(k===partes.length-1); out+=(ult && (p.g<100 || p.g%100===0))?' e ':' '; } out+=p.s; }
  return out.replace(/\s+/g,' ').trim();
}
function extenso(v){
  v=Math.round((Number(v)||0)*100); const r=Math.floor(v/100), c=v%100;
  let s=''; if(r) s=extInt(r)+(r===1?' real':' reais'); if(r>=1e6 && r%1e6===0) s=s.replace(/(milhão|milhões|bilhão|bilhões) (real|reais)$/,'$1 de $2');
  if(c){ s+=(r?' e ':'')+extInt(c)+(c===1?' centavo':' centavos'); }
  return s||'zero reais';
}

  async login(email,senha){ const {data,error}=await supa.auth.signInWithPassword({email,password:senha}); if(error) throw error; usuario=nomeDe(data.user.email); return usuario; },
  async logout(){ if(usaSupa()) await supa.auth.signOut(); localStorage.removeItem('orc_user'); usuario=null; },
  async list(){ if(usaSupa()){ const {data,error}=await supa.from('orcamentos').select('id,cliente,telefone,tipo,data_evento,local,total,status,responsavel,atualizado_em').order('atualizado_em',{ascending:false}); if(error) throw error; return data.map(r=>({id:r.id,cliente:r.cliente,telefone:r.telefone,tipo:r.tipo,dataEvento:r.data_evento,local:r.local,total:r.total,status:normStatus(r.status),responsavel:r.responsavel,atualizado:r.atualizado_em})); } return locais().map(r=>resumo(r)).sort((a,b)=>(b.atualizado||'').localeCompare(a.atualizado||'')); },
  async get(id){ if(usaSupa()){ const {data,error}=await supa.from('orcamentos').select('*').eq('id',id).single(); if(error) throw error; return Object.assign(data.dados,{id:data.id,status:normStatus(data.status),historico:data.historico||[],criadoPor:data.criado_por,atualizado:data.atualizado_em}); } const r=locais().find(r=>r.id===id); if(r) r.status=normStatus(r.status); return r; },
  async save(rec){ sincronizarContrato(rec); rec.atualizado=new Date().toISOString(); if(usaSupa()){ const {id,status,historico,criadoPor,atualizado,...dados}=rec; const linha={id, cliente:rec.orc.cliente, telefone:rec.orc.telefone, tipo:rec.orc.tipo, data_evento:rec.orc.dataEvento||null, local:rec.orc.local, total:totalRec(rec), status, responsavel:rec.orc.pixDe, criado_por:criadoPor||usuario, atualizado_em:atualizado, historico, dados}; const {error}=await supa.from('orcamentos').upsert(linha); if(error) throw error; } else { const l=locais().filter(r=>r.id!==rec.id); l.push(rec); localStorage.setItem('orc_db',JSON.stringify(l)); } },
  async remove(id){ if(usaSupa()){ const {error}=await supa.from('orcamentos').delete().eq('id',id); if(error) throw error; } else { localStorage.setItem('orc_db',JSON.stringify(locais().filter(r=>r.id!==id))); } }
};
function locais(){ try{ return JSON.parse(localStorage.getItem('orc_db')||'[]'); }catch(e){ return []; } }
function nomeDe(email){ return CONFIG.USUARIOS[email] || (email||'').split('@')[0]; }
function resumo(r){ sincronizarContrato(r); return {id:r.id,cliente:r.orc.cliente,telefone:r.orc.telefone,tipo:r.orc.tipo,dataEvento:r.orc.dataEvento,local:r.orc.local,total:totalRec(r),status:normStatus(r.status),responsavel:r.orc.pixDe,atualizado:r.atualizado}; }
function totalRec(r){ if(r.orc && r.orc.tipo==='contrato') return num(r.ctr&&r.ctr.total); return totalDe(r.orc); }
function sincronizarContrato(r){ if(r.orc && r.orc.tipo==='contrato' && r.ctr){ r.orc.cliente=r.ctr.contratante.nome||''; r.orc.dataEvento=r.ctr.data||''; r.orc.local=r.ctr.endereco||''; r.orc.pixDe=r.ctr.contratado||'saymon'; } }
function totalDe(o){
  if(o.tipo==='mao') return num(o.valorBase)+(o.extras||[]).reduce((s,e)=>s+num(e.v),0);
  const v=o.valores; if(!v) return 0; if(v.modo==='um') return num(v.total)||0; return 0;
}
</script>

<script>
/* =====================================================================
   NAVEGAÇÃO / LISTA
   ===================================================================== */
let rec=null, filtro='ativos', aba='orc';

function mostrar(v){ ['vLogin','vLista','vEditor'].forEach(id=>$('#'+id).classList.add('hidden')); $('#'+v).classList.remove('hidden'); window.scrollTo(0,0); }

async function iniciar(){
  $('#loginImg').src=IMG_BANNER;
  const u=await DB.init();
  if(usaSupa()){ $('#loginSupa').classList.remove('hidden'); $('#loginLocal').classList.add('hidden'); } else { $('#loginSupa').classList.add('hidden'); $('#loginLocal').classList.remove('hidden'); }
  if(u) entrou(); else mostrar('vLogin');
}
function entrou(){ $('#topoUser').textContent=usuario; $('#btnSair').classList.remove('hidden'); carregarLista(); }

$('#btnEntrar').onclick=async()=>{ $('#lErro').textContent=''; try{ await DB.login($('#lEmail').value.trim(), $('#lSenha').value); entrou(); }catch(e){ $('#lErro').textContent='Não foi possível entrar: '+(e.message||e); } };
$('#lSenha').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#btnEntrar').click(); });
$('#btnEntrarLocal').onclick=()=>{ usuario=$('#lNome').value; localStorage.setItem('orc_user',usuario); entrou(); };
$('#btnSair').onclick=async()=>{ await DB.logout(); $('#btnSair').classList.add('hidden'); $('#topoUser').textContent=''; mostrar('vLogin'); };

const FILTROS=[['ativos','Em andamento'],['todos','Todos'],['enviado','Enviados'],['confirmado','Confirmados'],['cancelado','Cancelados']];
let cacheLista=[];
async function carregarLista(){
  mostrar('vLista');
  try{ cacheLista=await DB.list(); }catch(e){ toast('Erro ao carregar: '+e.message); cacheLista=[]; }
  $('#filtros').innerHTML=FILTROS.map(([k,n])=>`<button class="sm ${filtro===k?'ativo':''}" data-f="${k}">${n}</button>`).join('');
  $$('#filtros button').forEach(b=>b.onclick=()=>{ filtro=b.dataset.f; carregarLista(); });
  desenharLista();
}
$('#busca').oninput=desenharLista;
function desenharLista(){
  const q=$('#busca').value.toLowerCase();
  let l=cacheLista.filter(r=>{
    if(filtro==='ativos') { if(r.status==='cancelado') return false; }
    else if(filtro!=='todos' && r.status!==filtro) return false;
    if(q && !((r.cliente||'')+' '+(r.local||'')+' '+(r.telefone||'')).toLowerCase().includes(q)) return false;
    return true;
  });
  if(!l.length){ $('#lista').innerHTML='<div class="card mudo" style="text-align:center">Nenhum orçamento aqui ainda. Toque em “+ Orçamento” pra começar.</div>'; return; }
  $('#lista').innerHTML=l.map(r=>`
    <div class="item" data-id="${r.id}">
      <div class="ic">${r.tipo==='mao'?'👨‍🍳':r.tipo==='contrato'?'📄':'🍖'}</div>
      <div class="info">
        <div class="nome">${esc(r.cliente||'(sem nome)')}</div>
        <div class="sub">${r.dataEvento?dataBR(r.dataEvento)+' · ':''}${esc(r.local||'')}${r.responsavel?' · '+cap(r.responsavel):''}</div>
        <div style="margin-top:5px"><span class="badge b-${r.status}">${STATUS_NOME[r.status]||r.status}</span></div>
      </div>
      <div class="val">${r.total?moeda(r.total):'<span class="mudo" style="font-weight:400">por pessoa</span>'}</div>
    </div>`).join('');
  $$('#lista .item').forEach(el=>el.onclick=()=>abrir(el.dataset.id));
}
const cap=s=>s?s[0].toUpperCase()+s.slice(1):'';

$('#btnNovoBuffet').onclick=()=>novo('buffet');
$('#btnNovoMao').onclick=()=>novo('mao');
$('#btnNovoCtr').onclick=()=>novo('contrato');
function novo(tipo){
  const orc = tipo==='mao'?modeloMao():tipo==='contrato'?modeloContratoAvulso():modeloBuffet();
  rec={id:uid(), status:'rascunho', historico:[{q:new Date().toISOString(),u:usuario,a:tipo==='contrato'?'Contrato criado':'Orçamento criado'}], criadoPor:usuario, orc, ctr:null};
  if(tipo==='contrato') rec.ctr=modeloContrato(orc);
  sujo=false; abrirEditor();
}
async function abrir(id){ try{ rec=await DB.get(id); if(!rec.ctr) rec.ctr=null; sujo=false; abrirEditor(); }catch(e){ toast('Erro: '+e.message); } }

/* =====================================================================
   EDITOR
   ===================================================================== */
$('#btnVoltar').onclick=async()=>{ await salvarSeMudou(); carregarLista(); };
$$('.abas button').forEach(b=>b.onclick=()=>irAba(b.dataset.aba));
function irAba(a){ if(rec.orc.tipo==='contrato' && a==='orc') a='ctr'; aba=a; $$('.abas button').forEach(b=>b.classList.toggle('ativo',b.dataset.aba===a)); ['orc','ctr','st'].forEach(k=>$('#aba'+cap(k)).classList.toggle('hidden',k!==a)); if(a==='ctr') desenharCtr(); if(a==='st') desenharSt();
  const docs=a!=='st'; $('#btnVer').disabled=!docs; $('#btnPdf').disabled=!docs; $('#btnPdf').textContent=a==='ctr'?'PDF Contrato':'PDF / Enviar'; }
function abrirEditor(){ mostrar('vEditor'); atualizarCab(); const soCtr=rec.orc.tipo==='contrato'; $('.abas button[data-aba=orc]').classList.toggle('hidden',soCtr); if(!soCtr) desenharOrc(); else $('#abaOrc').innerHTML=''; irAba(soCtr?'ctr':'orc'); $('#autosave').textContent=''; }
function atualizarCab(){ $('#edTitulo').textContent=(rec.orc.tipo==='mao'?'Mão de Obra — ':rec.orc.tipo==='contrato'?'Contrato — ':'Buffet — ')+(rec.orc.cliente||'novo'); $('#edBadge').innerHTML=`<span class="badge b-${rec.status}">${STATUS_NOME[rec.status]}</span>`; }

/* binding simples: data-b="caminho.no.objeto" */
function getP(obj,p){ return p.split('.').reduce((o,k)=>o==null?undefined:o[k],obj); }
function setP(obj,p,v){ const ks=p.split('.'); const last=ks.pop(); const o=ks.reduce((o,k)=>o[k],obj); o[last]=v; }
function ligar(container, base, aoMudar){
  container.querySelectorAll('[data-b]').forEach(el=>{
    const p=el.dataset.b; const v=getP(base,p);
    if(el.type==='checkbox') el.checked=!!v; else if(el.type==='radio') el.checked=(el.value===String(v)); else el.value=v==null?'':v;
    el.addEventListener(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='radio'||el.type==='date'||el.type==='time'?'change':'input',()=>{
      let nv; if(el.type==='checkbox') nv=el.checked; else if(el.dataset.n!=null) nv=num(el.value); else nv=el.value;
      setP(base,p,nv); if(aoMudar) aoMudar(p,el);
    });
  });
}
const DIAS=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
function diaSemana(c,selIn,selOut){
  const i=c.querySelector(selIn), o=c.querySelector(selOut); if(!i||!o) return;
  i.onclick=()=>{ try{ i.showPicker(); }catch(e){} };
  if(!i.value){ o.textContent='Toque pra abrir o calendário'; return; }
  const d=new Date(i.value+'T12:00:00'); o.innerHTML=`📅 <b style="color:var(--ouro)">${DIAS[d.getDay()]}</b>, ${dataBR(i.value)}`;
}
const campo=(lbl,attrs)=>`<label>${lbl}</label><input ${attrs}>`;
const linha=(val,extra='')=>`<div class="lin"><input value="${esc(val)}" ${extra}><button class="x" title="remover">×</button></div>`;

function desenharOrc(){
  const o=rec.orc, c=$('#abaOrc');
  const cab=`
  <details class="sec" open><summary>👤 Cliente e evento</summary><div class="corpo">
    <div class="row"><div>${campo('Nome do cliente','data-b="cliente"')}</div><div>${campo('Telefone / WhatsApp','data-b="telefone" inputmode="tel"')}</div></div>
    <div class="row"><div>${campo('Data do evento','type="date" data-b="dataEvento" id="inData"')}<div class="mudo" id="diaSemana" style="margin-top:4px"></div></div><div>${campo('Local do evento','data-b="local"')}</div></div>
    <div class="row"><div><label>Responsável</label><select data-b="pixDe"><option value="saymon">Saymon</option><option value="mayron">Mayron</option></select></div>
    <div>${campo('Validade (dias)','type="number" data-b="validade"')}</div></div>
  </div></details>`;
  c.innerHTML = cab + (o.tipo==='mao'?formMao(o):formBuffet(o));
  ligar(c, o, (p)=>{ if(p==='cliente') atualizarCab(); if(p==='dataEvento') diaSemana(c,'#inData','#diaSemana'); if(p.startsWith('convidados')||p.startsWith('valores.')) atualizarTotais(); });
  diaSemana(c,'#inData','#diaSemana'); acoesOrc(c,o);
}

function formBuffet(o){
  const v=o.valores;
  return `
  <details class="sec" open><summary>👥 Convidados <span class="dica" id="dicaConv"></span></summary><div class="corpo">
    <div class="opcoes">
      <label class="opc"><input type="radio" name="cm" value="minimo" data-b="convidados.modo"><div><b>Padrão:</b> “mínimo de ${CONFIG.MINIMO_ADULTOS} adultos”</div></label>
      <label class="opc"><input type="radio" name="cm" value="definido" data-b="convidados.modo"><div><b>Quantidade definida:</b> “N adultos”</div></label>
    </div>
    <div id="convQtd">${campo('Quantidade de adultos (pagantes)','type="number" inputmode="numeric" data-b="convidados.qtd" data-n')}</div>
  </div></details>

  <details class="sec" open><summary>💰 Pacotes e valores</summary><div class="corpo">
    <div class="opcoes">
      <label class="opc"><input type="radio" name="vm" value="todos" data-b="valores.modo"><div><b>Mostrar os 3 pacotes com valor por pessoa</b></div></label>
      <label class="opc"><input type="radio" name="vm" value="um" data-b="valores.modo"><div><b>Só o(s) pacote(s) que o cliente escolheu</b></div></label>
    </div>
    <div id="vUm">
      <label>Pacote(s) escolhido(s)</label>
      <label class="chk" style="margin:4px 0"><input type="checkbox" class="esc" value="sem"> Sem bebidas</label>
      <label class="chk" style="margin:4px 0"><input type="checkbox" class="esc" value="refri"> Com refrigerantes (não alcoólico)</label>
      <label class="chk" style="margin:4px 0"><input type="checkbox" class="esc" value="alc"> Com bebida alcoólica</label>
    </div>
    <div class="row" style="margin-top:6px">
      <div id="cpSem"><label>Sem bebidas — valor por pessoa (R$)</label><input inputmode="decimal" data-b="valores.pacotes.0.v" data-n></div>
      <div id="cpRefri"><label>Com refrigerantes — valor por pessoa (R$)</label><input inputmode="decimal" data-b="valores.pacotes.1.v" data-n></div>
    </div>
    <div class="pac" style="margin-top:10px" id="cpAlc"><div class="tit">Com bebida alcoólica</div>
      <div class="row"><div style="flex:2"><label>Marca da cerveja (se o cliente já escolheu)</label><input data-b="valores.marcaCerveja" placeholder="Ex.: Heineken"></div><div><label>Valor por pessoa (R$)</label><input inputmode="decimal" data-b="valores.pacotes.2.v" data-n></div></div>
    </div>
    <div id="vUm2">
      <label class="chk"><input type="checkbox" data-b="valores.mostrarPP"> Mostrar o valor por pessoa</label>
      <label class="chk"><input type="checkbox" data-b="valores.mostrarTotal"> Mostrar o valor total do orçamento</label>
      <div class="row"><div>${campo('Valor total (R$)','inputmode="decimal" data-b="valores.total" data-n id="inTotal"')}</div><div><label>&nbsp;</label><button class="g" id="btnCalc" style="width:100%">Calcular: adultos × valor</button></div></div>
      <div class="mudo" id="calcDica" style="margin-top:6px"></div>
    </div>
  </div></details>

  <details class="sec"><summary>📝 Textos da 1ª página <span class="dica">parágrafos</span></summary><div class="corpo">
    <div class="mudo" style="margin-bottom:6px">Toque no quadradinho pra alternar branco/dourado. Você pode editar, remover ou acrescentar parágrafos.</div>
    <div id="introList">${o.intro.map((p,i)=>`<div class="lin" data-i="${i}"><button class="cor ${p.c==='d'?'dourado':'branco'}" data-cor="${i}" title="cor"></button><textarea data-b="intro.${i}.t"></textarea><button class="x" data-rmp="${i}">×</button></div>`).join('')}</div>
    <button class="g sm" id="btnAddP">+ Parágrafo</button>
    ${campo('Observação extra (opcional, aparece antes do fechamento)','data-b="obs" placeholder="Ex.: Inclui 1 garçom adicional…"')}
  </div></details>

  <details class="sec"><summary>🍖 Cardápio <span class="dica">páginas 2 e 3</span></summary><div class="corpo" id="cardBox">${htmlCardapio(o)}</div></details>`;
}

function htmlCardapio(o){
  return o.cardapio.map((pg,pi)=>`<div class="pagtit">Página ${pi+2}</div>`+pg.map((s,si)=>`
    <div class="secao" data-p="${pi}" data-s="${si}">
      <div class="cab"><input data-b="cardapio.${pi}.${si}.t" placeholder="Título da seção">
        <button class="x" data-rms="${pi}.${si}">×</button></div>
      <div class="itens">${s.i.map((it,ii)=>`<div class="lin"><input data-b="cardapio.${pi}.${si}.i.${ii}"><button class="x" data-rmi="${pi}.${si}.${ii}">×</button></div>`).join('')}</div>
      <div class="acoes" style="margin-top:4px"><button class="g sm" data-addi="${pi}.${si}">+ Item</button></div>
    </div>`).join('')+`<button class="g sm" data-adds="${pi}">+ Seção na página ${pi+2}</button>`).join('');
}

function formMao(o){
  return `
  <details class="sec" open><summary>👨‍🍳 Serviço</summary><div class="corpo">
    ${campo('Título','data-b="titulo"')}
    ${campo('Subtítulo','data-b="subtitulo"')}
    ${campo('Quantidade de convidados (opcional, ex.: 40 adultos)','data-b="convidados.qtd" placeholder="deixe em branco pra não aparecer"')}
    <label>Parágrafos de apresentação</label>
    <div id="introList">${o.intro.map((p,i)=>`<div class="lin"><button class="cor ${p.c==='d'?'dourado':'branco'}" data-cor="${i}"></button><textarea data-b="intro.${i}.t"></textarea><button class="x" data-rmp="${i}">×</button></div>`).join('')}</div>
    <button class="g sm" id="btnAddP">+ Parágrafo</button>
    ${campo('Título da lista','data-b="inclusoTitulo"')}
    <div id="incList">${o.incluso.map((it,i)=>`<div class="lin"><input data-b="incluso.${i}"><button class="x" data-rminc="${i}">×</button></div>`).join('')}</div>
    <button class="g sm" id="btnAddInc">+ Item incluso</button>
  </div></details>
  <details class="sec" open><summary>💰 Valores <span class="dica" id="dicaTot"></span></summary><div class="corpo">
    <div class="row"><div style="flex:2">${campo('Descrição do serviço base','data-b="valorBaseTexto"')}</div><div>${campo('Valor (R$)','inputmode="decimal" data-b="valorBase" data-n')}</div></div>
    <div class="pagtit">Serviços extras (cobrados à parte)</div>
    <div id="extList">${o.extras.map((e,i)=>`<div class="lin"><input data-b="extras.${i}.t" placeholder="Ex.: Preparo dos complementos do almoço" style="flex:2"><input data-b="extras.${i}.v" data-n inputmode="decimal" placeholder="R$" style="flex:0 0 96px"><button class="x" data-rmext="${i}">×</button></div>`).join('')}</div>
    <button class="g sm" id="btnAddExt">+ Extra</button>
    <div style="margin-top:12px">Total: <span class="total" id="totMao"></span></div>
  </div></details>
  <details class="sec"><summary>📝 Outros textos</summary><div class="corpo">
    <div class="lin"><button class="cor ${o.pagto.c==='d'?'dourado':'branco'}" data-corpg="1"></button><textarea data-b="pagto.t"></textarea></div>
    ${campo('Observação extra (opcional)','data-b="obs"')}
    <label>Texto final</label><textarea data-b="rodape"></textarea>
    <div class="acoes"><button class="g sm" id="btnCopiarZap">Copiar texto pro WhatsApp</button></div>
  </div></details>`;
}

function acoesOrc(c,o){
  const re=()=>{ const y=window.scrollY; const abertos=Array.from(c.querySelectorAll('details.sec')).map(d=>d.open); desenharOrc(); c.querySelectorAll('details.sec').forEach((d,i)=>{ if(abertos[i]!=null) d.open=abertos[i]; }); requestAnimationFrame(()=>window.scrollTo(0,y)); };
  c.querySelectorAll('[data-cor]').forEach(b=>b.onclick=()=>{ const p=o.intro[+b.dataset.cor]; p.c=p.c==='d'?'b':'d'; b.classList.toggle('dourado'); b.classList.toggle('branco'); });
  c.querySelectorAll('[data-corpg]').forEach(b=>b.onclick=()=>{ o.pagto.c=o.pagto.c==='d'?'b':'d'; b.classList.toggle('dourado'); b.classList.toggle('branco'); });
  c.querySelectorAll('[data-rmp]').forEach(b=>b.onclick=()=>{ o.intro.splice(+b.dataset.rmp,1); re(); });
  const addP=c.querySelector('#btnAddP'); if(addP) addP.onclick=()=>{ o.intro.push({c:'b',t:''}); re(); };
  c.querySelectorAll('[data-rminc]').forEach(b=>b.onclick=()=>{ o.incluso.splice(+b.dataset.rminc,1); re(); });
  const addI=c.querySelector('#btnAddInc'); if(addI) addI.onclick=()=>{ o.incluso.push(''); re(); };
  c.querySelectorAll('[data-rmext]').forEach(b=>b.onclick=()=>{ o.extras.splice(+b.dataset.rmext,1); re(); atualizarTotais(); });
  const addE=c.querySelector('#btnAddExt'); if(addE) addE.onclick=()=>{ o.extras.push({t:'',v:0}); re(); };
  c.querySelectorAll('[data-rms]').forEach(b=>b.onclick=()=>{ const [p,s]=b.dataset.rms.split('.').map(Number); o.cardapio[p].splice(s,1); re(); });
  c.querySelectorAll('[data-rmi]').forEach(b=>b.onclick=()=>{ const [p,s,i]=b.dataset.rmi.split('.').map(Number); o.cardapio[p][s].i.splice(i,1); re(); });
  c.querySelectorAll('[data-addi]').forEach(b=>b.onclick=()=>{ const [p,s]=b.dataset.addi.split('.').map(Number); o.cardapio[p][s].i.push(''); re(); setTimeout(()=>{ const inputs=c.querySelectorAll(`[data-b^="cardapio.${p}.${s}.i."]`); inputs[inputs.length-1]?.focus(); },50); });
  c.querySelectorAll('[data-adds]').forEach(b=>b.onclick=()=>{ o.cardapio[+b.dataset.adds].push({t:'',l:'meia',i:['']}); re(); });
  const calc=c.querySelector('#btnCalc'); if(calc) calc.onclick=()=>{ const pp=ppEscolhido(o); const q=num(o.convidados.qtd); o.valores.total=Math.round(pp*q*100)/100; c.querySelector('#inTotal').value=o.valores.total?String(o.valores.total).replace('.',','):''; atualizarTotais(); };
  const zap=c.querySelector('#btnCopiarZap'); if(zap) zap.onclick=()=>{ navigator.clipboard.writeText(textoZap(o)).then(()=>toast('Texto copiado!')); };
  // abrir/fechar blocos conforme o modo
  c.querySelectorAll('[name=cm],[name=vm]').forEach(el=>el.addEventListener('change',atualizarTotais));
  c.querySelectorAll('input.esc').forEach(cb=>{ cb.checked=escolhidos(o).includes(cb.value); cb.addEventListener('change',()=>{ o.valores.escolhidos=['sem','refri','alc'].filter(id=>c.querySelector(`input.esc[value=${id}]`).checked); atualizarTotais(); }); });
  atualizarTotais();
}
function escolhidos(o){ const v=o.valores; if(!Array.isArray(v.escolhidos)) v.escolhidos=[v.escolhido||'sem']; if(!v.escolhidos.length) v.escolhidos=['sem']; return v.escolhidos; }
function ppEscolhido(o){ const e=escolhidos(o); if(e.length!==1) return 0; const p=o.valores.pacotes.find(p=>p.id===e[0]); return p?num(p.v):0; }
function atualizarTotais(){
  const o=rec.orc, c=$('#abaOrc'); if(!c) return;
  if(o.tipo==='mao'){ const t=c.querySelector('#totMao'); if(t) t.textContent=moeda(totalDe(o)); const d=c.querySelector('#dicaTot'); if(d) d.textContent=moeda(totalDe(o)); return; }
  const v=o.valores;
  c.querySelector('#convQtd')?.classList.toggle('hidden', o.convidados.modo!=='definido');
  const dc=c.querySelector('#dicaConv'); if(dc) dc.textContent=o.convidados.modo==='definido'?`${num(o.convidados.qtd)||0} adultos`:`mínimo de ${CONFIG.MINIMO_ADULTOS}`;
  const um=v.modo==='um', e=escolhidos(o);
  c.querySelector('#vUm')?.classList.toggle('hidden', !um); c.querySelector('#vUm2')?.classList.toggle('hidden', !um);
  c.querySelector('#cpSem')?.classList.toggle('hidden', um && !e.includes('sem'));
  c.querySelector('#cpRefri')?.classList.toggle('hidden', um && !e.includes('refri'));
  c.querySelector('#cpAlc')?.classList.toggle('hidden', um && !e.includes('alc'));
  const pp=c.querySelector('[data-b="valores.mostrarPP"]'); if(pp) pp.closest('label').classList.toggle('hidden', um && e.length===1 && e[0]==='alc' && !(v.marcaCerveja||'').trim());
  const calc=c.querySelector('#btnCalc'); if(calc) calc.disabled = e.length!==1;
  const cd=c.querySelector('#calcDica'); if(cd){ const q=num(o.convidados.qtd), pp=ppEscolhido(o); cd.textContent = e.length!==1 ? 'Com mais de um pacote, informe o valor total manualmente.' : (o.convidados.modo==='definido' ? `${q} adultos × ${moeda(pp)} = ${moeda(q*pp)}` : 'Defina a quantidade de adultos em “Convidados” pra calcular automaticamente.'); }
  c.querySelectorAll('.opc').forEach(l=>l.classList.toggle('on', l.querySelector('input').checked));
}
function textoZap(o){
  const L=[]; L.push('🔥 *Churrasco em Brasília Buffet*'); L.push('_'+o.subtitulo+'_'); L.push('👨‍🍳 *'+o.titulo+'*');
  o.intro.forEach(p=>L.push(p.t)); L.push('✅ *'+o.inclusoTitulo+'*'); o.incluso.forEach(i=>L.push('• '+i));
  L.push('💰 *'+o.valorBaseTexto+': '+moeda(o.valorBase)+'*'); o.extras.forEach(e=>L.push('➕ '+e.t+': '+moeda(e.v)));
  if(o.extras.length) L.push('*Total: '+moeda(totalDe(o))+'*');
  if(o.obs) L.push(o.obs); L.push('📲 Conheça nosso trabalho: '+CONFIG.INSTAGRAM_URL); L.push(o.rodape+' 🎉'); return L.join('\n');
}

/* ---------- CONTRATO ---------- */
function desenharCtr(){
  const o=rec.orc; if(!rec.ctr) rec.ctr=modeloContrato(o);
  const k=rec.ctr, c=$('#abaCtr');
  // sugere valores vindos do orçamento se ainda estiverem vazios
  if(!k.total && totalDe(o)) k.total=totalDe(o);
  if(!k.pessoas && o.convidados && num(o.convidados.qtd)) k.pessoas=num(o.convidados.qtd);
  if(!k.data && o.dataEvento) k.data=o.dataEvento;
  if(!k.endereco && o.local) k.endereco=o.local;
  if(o.tipo==='buffet' && o.valores.modo==='um' && escolhidos(o).length===1 && !k._servAuto){ k.servico='Churrasco em domicílio ('+({sem:'sem bebidas',refri:'com bebidas não alcoólicas',alc:'com bebidas alcoólicas'}[escolhidos(o)[0]])+')'; k._servAuto=true; }
  c.innerHTML=`
  ${o.tipo==='contrato'?'':'<div class="aviso">Cliente, data, local, quantidade e valor vêm do orçamento — confira e complete o que faltar.</div>'}
  <details class="sec" open><summary>👤 Contratante</summary><div class="corpo">
    ${campo('Nome completo','data-b="contratante.nome"')}
    <div class="row"><div>${campo('CPF','data-b="contratante.cpf" inputmode="numeric" placeholder="000.000.000-00"')}</div><div>${campo('Endereço','data-b="contratante.endereco"')}</div></div>
    <label>Contratado</label><select data-b="contratado"><option value="saymon">Saymon</option><option value="mayron">Mayron</option></select>
  </div></details>
  <details class="sec" open><summary>📋 Objeto do contrato</summary><div class="corpo">
    ${campo('Tipo de serviço','data-b="servico"')}
    <div class="row"><div>${campo('Pessoas adultas','type="number" inputmode="numeric" data-b="pessoas" data-n')}</div><div>${campo('Valor total (R$)','inputmode="decimal" data-b="total" data-n id="ctrTotal"')}</div></div>
    <div class="row"><div>${campo('Data do evento','type="date" data-b="data" id="inDataC"')}<div class="mudo" id="diaSemanaC" style="margin-top:4px"></div></div><div>${campo('Início','type="time" data-b="horaIni"')}</div><div>${campo('Término','type="time" data-b="horaFim"')}</div></div>
    ${campo('Endereço do evento','data-b="endereco"')}
    <label class="chk"><input type="checkbox" data-b="adiantamentoAuto"> Adiantamento = 50% do total (automático)</label>
    <div id="adiBox">${campo('Adiantamento (R$)','inputmode="decimal" data-b="adiantamento" data-n')}</div>
    <div class="mudo" id="adiDica"></div>
  </div></details>
  <details class="sec" open><summary>➕ Cláusulas adicionais <span class="dica">${k.extras.length||'nenhuma'}</span></summary><div class="corpo">
    <div id="extCtr">${k.extras.map((e,i)=>htmlExtra(e,i)).join('')}</div>
    <div class="acoes"><button class="g sm" data-ext="garcom">+ Garçom adicional</button><button class="g sm" data-ext="aluguel">+ Aluguel de material</button><button class="g sm" data-ext="livre">+ Cláusula livre</button></div>
  </div></details>
  <details class="sec"><summary>📝 Textos padrão do contrato</summary><div class="corpo">
    <label>Fornecimento</label><textarea data-b="textos.fornece"></textarea>
    <label>Danos</label><textarea data-b="textos.danos"></textarea>
    <label>Quebra/extravio</label><textarea data-b="textos.quebra"></textarea>
    <label>Foro</label><textarea data-b="textos.foro"></textarea>
    <label>Encerramento</label><textarea data-b="textos.final"></textarea>
    ${campo('Data do contrato','type="date" data-b="dataContrato"')}
  </div></details>`;
  ligar(c,k,(p)=>{ if(p==='total'||p==='adiantamentoAuto'||p==='adiantamento') adiantamento(); if(p==='data') diaSemana(c,'#inDataC','#diaSemanaC'); if(p==='contratante.nome'){ sincronizarContrato(rec); atualizarCab(); } });
  diaSemana(c,'#inDataC','#diaSemanaC');
  c.querySelectorAll('[data-ext]').forEach(b=>b.onclick=()=>{ const t=b.dataset.ext; k.extras.push(t==='garcom'?{tipo:t,qtd:1,desc:'',v:0}:t==='aluguel'?{tipo:t,qtd:1,desc:'',v:0}:{tipo:'livre',t:''}); desenharCtr(); });
  c.querySelectorAll('[data-rmx]').forEach(b=>b.onclick=()=>{ k.extras.splice(+b.dataset.rmx,1); desenharCtr(); });
  adiantamento();
}
function htmlExtra(e,i){
  if(e.tipo==='livre') return `<div class="pac"><div class="tit">Cláusula livre <button class="x" data-rmx="${i}" style="margin-left:auto">×</button></div><textarea data-b="extras.${i}.t" placeholder="Escreva a cláusula completa"></textarea></div>`;
  const tit=e.tipo==='garcom'?'Garçom adicional':'Aluguel de material';
  return `<div class="pac"><div class="tit">${tit} <button class="x" data-rmx="${i}" style="margin-left:auto">×</button></div>
    <div class="row">${e.tipo==='garcom'?`<div>${campo('Quantidade',`type="number" data-b="extras.${i}.qtd" data-n`)}</div>`:`<div style="flex:2">${campo('Material',`data-b="extras.${i}.desc" placeholder="Ex.: 40 cadeiras e 5 mesas"`)}</div>`}<div>${campo('Valor (R$)',`inputmode="decimal" data-b="extras.${i}.v" data-n`)}</div></div>
    <label class="chk"><input type="checkbox" data-b="extras.${i}.incluso"> Valor já incluso no total do contrato</label></div>`;
}
function textoExtra(e){
  if(e.tipo==='livre') return e.t||'';
  const fim = e.incluso ? ', valor este já incluso no valor total deste contrato.' : ', a ser pago juntamente com o restante do valor contratado.';
  if(e.tipo==='garcom'){ const q=num(e.qtd)||1; return `O CONTRATADO fornecerá ainda ${q} (${extInt(q)}) ${q>1?'garçons adicionais':'garçom adicional'} para o evento, no valor de ${moedaCtr(e.v)} (${extenso(e.v)})${fim}`; }
  return `O CONTRATADO fornecerá, a título de aluguel, ${e.desc||'________'}, no valor de ${moedaCtr(e.v)} (${extenso(e.v)})${fim}`;
}
function adiantamento(){
  const k=rec.ctr, c=$('#abaCtr'); if(k.adiantamentoAuto) k.adiantamento=Math.round(num(k.total)*50)/100;
  c.querySelector('#adiBox')?.classList.toggle('hidden',!!k.adiantamentoAuto);
  const inp=c.querySelector('[data-b="adiantamento"]'); if(inp && k.adiantamentoAuto) inp.value=k.adiantamento;
  const d=c.querySelector('#adiDica'); if(d) d.textContent=`Adiantamento ${moeda(k.adiantamento)} · Restante ${moeda(num(k.total)-num(k.adiantamento))}`;
}

/* ---------- STATUS ---------- */
function desenharSt(){
  const c=$('#abaSt'); const idx=STATUS.findIndex(s=>s[0]===rec.status);
  const fluxo=STATUS.filter(s=>s[0]!=='cancelado');
  c.innerHTML=`
  <div class="card"><h3>Andamento</h3>
    <div class="fluxo">${fluxo.map((s,i)=>`<div class="passo ${i<idx?'feito':''} ${s[0]===rec.status?'atual':''}"><div class="bola">${i<idx?'✓':i+1}</div><div class="nome">${s[1]}</div>${i===idx+1&&rec.status!=='cancelado'?`<button class="o sm" data-st="${s[0]}">Avançar</button>`:''}${i!==idx&&!(i===idx+1)?`<button class="g sm" data-st="${s[0]}">ir</button>`:''}</div>`).join('')}</div>
    <div class="acoes">${rec.status!=='cancelado'?'<button class="v sm" data-st="cancelado">Cancelar orçamento</button>':'<button class="g sm" data-st="rascunho">Reabrir como rascunho</button>'}<button class="g sm" id="btnExcluir" style="margin-left:auto">Excluir</button></div>
  </div>
  <div class="card"><h3>Histórico</h3>${(rec.historico||[]).slice().reverse().map(h=>`<div class="hist"><b>${esc(h.a)}</b> — ${esc(h.u||'')} · ${new Date(h.q).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</div>`).join('')||'<div class="mudo">Nada ainda.</div>'}</div>`;
  c.querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{ rec.status=b.dataset.st; rec.historico.push({q:new Date().toISOString(),u:usuario,a:'Status: '+STATUS_NOME[rec.status]}); atualizarCab(); await salvar(true); desenharSt(); });
  c.querySelector('#btnExcluir').onclick=async()=>{ if(!confirm('Excluir este orçamento de vez?')) return; await DB.remove(rec.id); toast('Excluído'); carregarLista(); };
}

/* ---------- SALVAR (automático) ---------- */
let sujo=false, timerSalvar=null, salvando=false;
async function salvar(silencioso){
  if(salvando) { sujo=true; return; }
  salvando=true; const ind=$('#autosave'); if(ind) ind.textContent='salvando…';
  try{ sujo=false; await DB.save(rec); if(!silencioso) toast('Salvo ✓'); if(ind) ind.textContent='salvo ✓'; atualizarCab(); }
  catch(e){ sujo=true; if(ind) ind.textContent='não salvo!'; toast('Erro ao salvar: '+e.message); }
  salvando=false; if(sujo) agendarSalvar();
}
function agendarSalvar(){ sujo=true; const ind=$('#autosave'); if(ind) ind.textContent='…'; clearTimeout(timerSalvar); timerSalvar=setTimeout(()=>salvar(true),1200); }
async function salvarSeMudou(){ clearTimeout(timerSalvar); if(sujo) await salvar(true); }
// qualquer digitação, seleção ou clique em botão de lista dentro do editor agenda o salvamento
['input','change'].forEach(ev=>$('#vEditor').addEventListener(ev,e=>{ if(e.target.closest('#abaOrc,#abaCtr')) agendarSalvar(); }));
$('#vEditor').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b && b.closest('#abaOrc,#abaCtr') && !b.id.startsWith('btnCopiar')) agendarSalvar(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden && rec && !$('#vEditor').classList.contains('hidden')) salvarSeMudou(); });
$('#btnSalvar').onclick=()=>{ clearTimeout(timerSalvar); salvar(); };
</script>

<script>
/* =====================================================================
   DOCUMENTOS — HTML fiel aos modelos
   ===================================================================== */
function cabOrc(o){
  const conv = o.tipo==='mao'
    ? (o.convidados.qtd ? `Quantidade de convidados: ${esc(o.convidados.qtd)}` : '')
    : (o.convidados.modo==='definido' ? `Quantidade de convidados: ${num(o.convidados.qtd)||0} adultos` : `Quantidade de convidados: mínimo de ${CONFIG.MINIMO_ADULTOS} adultos`);
  return `<div class="cab"><img src="${IMG_BANNER}"><div class="tit"><div class="a">Orçamento - ${esc(o.ano)}</div><div>${conv}</div><div>Orçamento válido por ${esc(o.validade)} dias</div></div></div>`;
}
const par = p => `<p class="${p.c==='d'?'d':''}">${esc(p.t)}</p>`;
function blocoPix(o){ const k=CONFIG.CONTRATADOS[o.pixDe]||CONFIG.CONTRATADOS.saymon; return `<p class="c">${k.pixOrc.map(esc).join('<br>')}</p>`; }
function fechoAss(o){ return `${o.obs?`<p>${esc(o.obs)}</p>`:''}<p class="c">${esc(o.fecho)}</p><div class="ass">${esc(o.assinatura).replace(/\n/g,'<br>')}</div>`; }
function fimPag(semDuvida){ return `<div class="fim"><div class="txt">${semDuvida?'':'Em caso de dúvidas, seguimos à disposição.<br>'}Conheça o nosso instagram, clicando aqui:<br><a href="${CONFIG.INSTAGRAM_URL}">@churrascoembrasilia</a><br><br>Acesse o nosso site:<br><a href="${CONFIG.SITE_URL}">Clicando aqui</a></div><img src="${IMG_FLAG}"></div>`; }

function valoresBuffet(o){
  const v=o.valores; const marca=(v.marcaCerveja||'').trim();
  const valorDe=id=>num((v.pacotes.find(p=>p.id===id)||{}).v);
  // linha de um pacote; sem marca no alcoólico => asterisco + nota
  const li=(id,fim,comValor)=>{
    let t=PACOTES_TXT[id]; let nota=false;
    if(id==='alc'){ if(marca) t=t.replace('{cerveja}',' '+marca); else { t=t.replace('{cerveja}',''); nota=true; } }
    const val=(comValor && !nota) ? ` <span class="d">${moeda(valorDe(id))}</span> (${extenso(valorDe(id))})` : '';
    return {html:`<li>${esc(t)}${nota?'<span class="d">*</span>':''}${val}${fim}</li>`, nota};
  };
  let lis=[], temNota=false;
  if(v.modo==='todos'){ ['sem','refri','alc'].forEach((id,i)=>{ const r=li(id, i<2?';':'.', true); lis.push(r.html); temNota=temNota||r.nota; }); }
  else { const e=['sem','refri','alc'].filter(id=>escolhidos(o).includes(id)); e.forEach((id,i)=>{ const r=li(id, i<e.length-1?';':'.', !!v.mostrarPP); lis.push(r.html); temNota=temNota||r.nota; }); }
  let html=`<p style="margin:0"><b>Valores:</b></p><ul>${lis.join('')}</ul>`;
  if(temNota) html+=`<p class="nota"><span class="d">*</span> ${NOTA_CERVEJA}.</p>`;
  if(v.modo==='um' && v.mostrarTotal && num(v.total)>0) html+=`<div class="tot">Valor total: ${moeda(v.total)} (${extenso(v.total)}).</div>`;
  return html;
}
function secaoHtml(s){
  const itens=s.i.filter(x=>x!=null&&String(x).trim()!=='');
  const corte=itens.indexOf('---'); const duas=s.duas&&s.l==='inteira';
  const cls=['sec', s.l==='inteira'?'inteira':'', itens.length?'':'semitens', (duas&&corte<0)?'duascol':''].join(' ');
  const ul=l=>`<ul>${l.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;
  let corpo='';
  if(itens.length){ if(duas&&corte>=0) corpo=`<div style="display:flex"><div style="flex:1">${ul(itens.slice(0,corte))}</div><div style="flex:1">${ul(itens.slice(corte+1))}</div></div>`; else corpo=ul(itens.filter(i=>i!=='---')); }
  return `<div class="${cls}"><h4>${esc(s.t)}</h4>${corpo}</div>`;
}
function paginasBuffet(o){
  const pgs=[];
  pgs.push(`<div class="pg orc"><div class="miolo">${cabOrc(o)}<div class="corpo">${o.intro.map(par).join('')}${blocoPix(o)}${valoresBuffet(o)}${fechoAss(o)}</div></div></div>`);
  o.cardapio.forEach((pg,i)=>{
    const ult=i===o.cardapio.length-1; if(!pg.length && !ult) return;
    pgs.push(`<div class="pg orc" ${ult?'data-rodape="190"':''}><div class="miolo">${cabOrc(o)}<div class="grade" style="padding-top:26px">${pg.map(secaoHtml).join('')}</div></div>${ult?fimPag():''}</div>`);
  });
  return pgs;
}
function paginasMao(o){
  const extras=(o.extras||[]).filter(e=>e.t||num(e.v));
  let val=`<p style="margin:0"><b>Valores:</b></p><ul><li>${esc(o.valorBaseTexto)} <span class="d">${moeda(o.valorBase)}</span> (${extenso(o.valorBase)})${extras.length?';':'.'}</li>${extras.map((e,i)=>`<li>${esc(e.t)} <span class="d">${moeda(e.v)}</span> (${extenso(e.v)})${i===extras.length-1?'.':';'}</li>`).join('')}</ul>`;
  if(extras.length) val+=`<div class="tot">Valor total: ${moeda(totalDe(o))} (${extenso(totalDe(o))}).</div>`;
  const corpo=`<div class="corpo"><h3>${esc(o.titulo)}</h3><div class="sub">${esc(o.subtitulo)}</div>${o.intro.map(par).join('')}<p style="margin:0"><b>${esc(o.inclusoTitulo)}</b></p><ul>${o.incluso.filter(x=>x.trim()).map(i=>`<li>${esc(i)}</li>`).join('')}</ul>${val}${par(o.pagto)}${blocoPix(o)}${o.rodape?`<p>${esc(o.rodape)}</p>`:''}${fechoAss(o)}</div>`;
  return [`<div class="pg orc mao" data-rodape="190"><div class="miolo">${cabOrc(o)}${corpo}</div>${fimPag(true)}</div>`];
}
function paginasContrato(k){
  const ct=CONFIG.CONTRATADOS[k.contratado]||CONFIG.CONTRATADOS.saymon;
  const rest=Math.round((num(k.total)-num(k.adiantamento))*100)/100;
  const pessoas=num(k.pessoas)||0;
  const servico=esc(k.servico); const m=servico.match(/^(.*?)(\(.*\))$/); const servHtml = m ? `${m[1]}<b>${m[2]}</b>` : servico;
  const extras=(k.extras||[]).map(textoExtra).filter(Boolean).map(t=>`<p>${esc(t).replace(/^O CONTRATADO/,'O <b>CONTRATADO</b>').replace(/^O CONTRATANTE/,'O <b>CONTRATANTE</b>')}</p>`).join('');
  return [`<div class="pg ctr"><div class="miolo">
    <h2>CONTRATO</h2>
    <p><b>CONTRATANTE:</b> ${esc(k.contratante.nome||'NOME COMPLETO')}, CPF ${esc(k.contratante.cpf||'000.000.000-00')}, endereço: ${esc(k.contratante.endereco||'Brasília, DF')}.</p>
    <p><b>CONTRATADO:</b> ${esc(ct.nome)}, CPF ${esc(ct.cpf)}, endereço: ${esc(ct.endereco)}.</p>
    <p><b>OBJETO:</b> Prestação de Serviços do tipo: ${servHtml} para ${pessoas} (${extInt(pessoas)}) pessoas adultas, no valor total de ${moedaCtr(k.total)} (${extenso(k.total)}), a ser prestado no dia ${dataExt(k.data)}, no horário compreendido entre ${horaCtr(k.horaIni)} e ${horaCtr(k.horaFim)}, no seguinte endereço: ${esc(k.endereco)}.</p>
    <p>${esc(k.textos.fornece).replace('O CONTRATADO','O <b>CONTRATADO</b>')}</p>
    <p>O <b>CONTRATANTE</b> deverá enviar por meio de ${esc(ct.meioPagto)}, o valor de ${moedaCtr(k.adiantamento)} (${extenso(k.adiantamento)}), referente ao adiantamento do serviço contratado, <b>confirmando o agendamento.</b></p>
    <p class="ind"><u>Dados Pix:</u>&nbsp;&nbsp; ${esc(ct.pixCtr)}</p>
    ${ct.banco?`<div class="banco"><div class="l"><u>Dados para transferência bancária:</u></div><div class="r">${ct.banco.map(esc).join('<br>')}</div></div>`:''}
    <p>O <b>CONTRATANTE</b> pagará o restante, no valor de ${moedaCtr(rest)} (${extenso(rest)}), no dia ${dataExt(k.data)}, por ocasião do término da prestação de serviço.</p>
    ${extras}
    <p>${esc(k.textos.danos).replace('O CONTRATADO','O <b>CONTRATADO</b>')}</p>
    <p>${esc(k.textos.quebra).replace('O CONTRATANTE','O <b>CONTRATANTE</b>')}</p>
    <p><b>A proposta/orçamento enviada, mais os e-mails e mensagens eletrônicas trocadas, quando acordados e respondidos</b> são parte integrante deste contrato e deverão ser cumpridos na íntegra por ambas as partes.</p>
    <p>${esc(k.textos.foro)}</p>
    <p>${esc(k.textos.final).replace(/^CONTRATANTE e CONTRATADO/,'<b>CONTRATANTE</b> e <b>CONTRATADO</b>')}</p>
    <div class="data">${dataExt(k.dataContrato)}.</div>
    <div class="assin"><b>CONTRATADO</b>${esc(ct.nome)}</div>
    <div class="assin" style="margin-top:56px"><b>CONTRATANTE</b>${esc(k.contratante.nome||'NOME COMPLETO')}</div>
  </div></div>`];
}

function paginasAtuais(){
  if(aba==='ctr'){ if(!rec.ctr) rec.ctr=modeloContrato(rec.orc); return {titulo:'Contrato', pags:paginasContrato(rec.ctr), nome:`Contrato - ${semAcento(rec.orc.cliente)||'cliente'}.pdf`}; }
  const o=rec.orc; if(o.tipo==='contrato') { aba='ctr'; return paginasAtuais(); } return {titulo: o.tipo==='mao'?'Orçamento Mão de Obra':'Orçamento Buffet', pags: o.tipo==='mao'?paginasMao(o):paginasBuffet(o), nome:`Proposta - ${semAcento(o.cliente)||'cliente'}.pdf`};
}
/* encaixa o conteúdo na página (reduz um pouco se passar) */
function ajustar(container){
  container.querySelectorAll('.pg').forEach(pg=>{
    const m=pg.querySelector('.miolo'); m.style.transform='';
    const limite=1123-(parseInt(pg.dataset.rodape||'0')); const h=m.scrollHeight;
    if(h>limite){ m.style.transform=`scale(${(limite/h).toFixed(4)})`; }
  });
}
async function montar(container){
  const d=paginasAtuais(); const r=$('#render'); r.innerHTML=d.pags.join(''); await document.fonts.ready; ajustar(r);
  if(container!==r){ container.innerHTML=''; while(r.firstChild) container.appendChild(r.firstChild); } return d;
}

/* ---------- PREVIEW ---------- */
$('#btnVer').onclick=verPreview; $('#btnFecharPrev').onclick=()=>$('#vPrev').classList.add('hidden'); $('#btnPrevPdf').onclick=gerarPdf;
async function verPreview(){
  await salvarSeMudou();
  const box=$('#prevPags'); const s=Math.min(1,(window.innerWidth-28)/794);
  $('#vPrev').classList.remove('hidden');
  const tmp=document.createElement('div'); const d=await montar(tmp); $('#prevTit').textContent=d.titulo;
  box.innerHTML=''; tmp.querySelectorAll('.pg').forEach(pg=>{ const w=document.createElement('div'); w.className='pgwrap'; w.style.width=(794*s)+'px'; w.style.height=(1123*s)+'px'; pg.classList.add('esc'); pg.style.transform=`scale(${s})`; w.appendChild(pg); box.appendChild(w); });
}

/* ---------- PDF ---------- */
$('#btnPdf').onclick=gerarPdf;
async function gerarPdf(){
  const btn=$('#btnPdf'); btn.disabled=true; btn.textContent='Gerando…';
  try{
    clearTimeout(timerSalvar); await salvar(true);
    const r=$('#render'); const d=await montar(r);
    const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:'mm',format:'a4',compress:true});
    const pgs=Array.from(r.querySelectorAll('.pg'));
    for(let i=0;i<pgs.length;i++){
      const cv=await html2canvas(pgs[i],{scale:2,useCORS:true,backgroundColor:null,logging:false,width:794,height:1123,windowWidth:794});
      if(i>0) pdf.addPage();
      pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);
      const pr=pgs[i].getBoundingClientRect(), k=210/794;
      pgs[i].querySelectorAll('a[href]').forEach(a=>{ const b=a.getBoundingClientRect(); pdf.link((b.left-pr.left)*k,(b.top-pr.top)*k,b.width*k,b.height*k,{url:a.href}); });
    }
    r.innerHTML='';
    const blob=pdf.output('blob'); const file=new File([blob], d.nome, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:d.nome}); }catch(e){ if(e.name!=='AbortError') baixar(blob,d.nome); }
    } else baixar(blob,d.nome);
    const acao=(aba==='ctr'?'Contrato':'Orçamento')+' gerado em PDF'; rec.historico.push({q:new Date().toISOString(),u:usuario,a:acao});
    if(aba==='orc' && rec.status==='rascunho'){ rec.status='enviado'; rec.historico.push({q:new Date().toISOString(),u:usuario,a:'Status: Orçamento enviado'}); }
    if(aba==='ctr' && ['enviado','rascunho'].includes(rec.status)){ rec.status='confirmado'; rec.historico.push({q:new Date().toISOString(),u:usuario,a:'Status: Confirmado'}); }
    await salvar(true);
  }catch(e){ console.error(e); toast('Erro ao gerar PDF: '+e.message); }
  btn.disabled=false; btn.textContent=aba==='ctr'?'PDF Contrato':'PDF / Enviar';
}
function baixar(blob,nome){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); }

iniciar();
</script>
