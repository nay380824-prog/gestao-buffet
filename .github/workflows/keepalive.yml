# Mantém o projeto Supabase acordado (plano grátis pausa após ~7 dias sem uso).
# Roda a cada 2 dias e faz uma consulta simples na tabela de orçamentos.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 12 */2 * *"   # a cada 2 dias, 12h UTC (9h em Brasília)
  workflow_dispatch:          # permite rodar manualmente em Actions → Run workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta rápida no Supabase
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://aqfgdmojmlwcpexhloef.supabase.co/rest/v1/orcamentos?select=id&limit=1" \
