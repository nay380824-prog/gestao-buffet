# Mantém o projeto Supabase acordado (o plano grátis pausa após ~7 dias sem uso).
# Roda a cada 2 dias e ESCREVE de verdade no banco, na tabela keepalive.
# Se algo der errado, o job falha e o GitHub manda e-mail — ou seja, verde aqui
# passou a significar "funcionou mesmo", e não só "o servidor atendeu".
name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 12 */2 * *"   # a cada 2 dias, 12h UTC (9h em Brasília)
  workflow_dispatch:          # permite rodar manualmente em Actions → Run workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Marcar uso no banco do Supabase
        env:
          URL: https://aqfgdmojmlwcpexhloef.supabase.co
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxZmdkbW9qbWx3Y3BleGhsb2VmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MTkyMjAsImV4cCI6MjEwNDE5NTIyMH0.6DvsYBCOr-L8BAPv7rLvH_vYuSLtkR8dxBVDoV_tfAE
        run: |
          agora=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          codigo=$(curl -s -o resposta.txt -w "%{http_code}" --max-time 30 \
            -X PATCH "$URL/rest/v1/keepalive?id=eq.1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"visto_em\":\"$agora\"}") || {
              echo "::error::Não consegui nem falar com o Supabase. O endereço do projeto pode não existir mais, que é o que acontece quando ele está pausado."
              exit 1
            }

          echo "Resposta HTTP: $codigo"
          echo "Conteúdo: $(cat resposta.txt)"

          if [ "$codigo" != "200" ]; then
            echo "::error::O Supabase respondeu $codigo em vez de 200. Veja o conteúdo acima."
            exit 1
          fi

          if ! grep -q "visto_em" resposta.txt; then
            echo "::error::A resposta veio vazia, então nada foi gravado. Confira se a tabela keepalive existe e se a política de UPDATE está liberada para anon."
            exit 1
          fi

          echo "Tudo certo: o banco recebeu a escrita em $agora."
